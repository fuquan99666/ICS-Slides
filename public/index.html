<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICS Slides</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 700px;
      padding: 40px 50px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 36px;
      letter-spacing: 2px;
      font-weight: 300;
    }
    .course-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .course-link {
      display: block;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      color: #e0e7ff;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.04);
      position: relative;
      overflow: hidden;
    }
    .course-link:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateX(6px);
      border-color: rgba(96, 165, 250, 0.3);
      box-shadow: 0 8px 30px rgba(96, 165, 250, 0.1);
    }
    .course-link .arrow {
      float: right;
      opacity: 0.3;
      transition: opacity 0.3s;
    }
    .course-link:hover .arrow {
      opacity: 0.8;
    }
    .course-link .badge {
      display: inline-block;
      background: rgba(96, 165, 250, 0.2);
      color: #93bbfc;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      margin-right: 12px;
      letter-spacing: 0.5px;
    }
    .footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 20px;
    }
    .footer a {
      color: rgba(255, 255, 255, 0.3);
      text-decoration: none;
      transition: color 0.3s;
    }
    .footer a:hover {
      color: rgba(255, 255, 255, 0.6);
    }
    @media (max-width: 600px) {
      .container { padding: 30px 20px; }
      h1 { font-size: 2rem; }
      .course-link { font-size: 1rem; padding: 14px 18px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📖 ICS Small Class Slides</h1>
    <p class="subtitle">Introduction to Computer Systems</p>

    <div class="course-grid">
      <a href="/ICS-Slides/0/" class="course-link">
        0:   Introduction
        <span class="arrow">→</span>
      </a>
      <a href="/ICS-Slides/1/" class="course-link">
        1: Data Representation
        <span class="arrow">→</span>
      </a>
      <a href="/ICS-Slides/2/" class="course-link">
        2: Machine Programming I
        <span class="arrow">→</span>
      </a>
    </div>

    <div class="footer">
      Built with <a href="https://sli.dev" target="_blank">Slidev</a> &nbsp;·&nbsp; 
      © 2026 ICS
    </div>
  </div>
</body>
</html>
